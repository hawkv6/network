name: hawkv6

mgmt:
  network: mgt_net

topology:
  nodes:

    XR-1:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:25.3.1
      mgmt-ipv4: 172.20.20.11
      mgmt-ipv6: "3fff:172:20:20::11"
      startup-config: config/XR-1.cfg
      labels:
        graph-level: 3
        graph-icon: router

    XR-2:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:25.3.1
      mgmt-ipv4: 172.20.20.12
      mgmt-ipv6: "3fff:172:20:20::12"
      startup-config: config/XR-2.cfg
      labels:
        graph-level: 4
        graph-icon: router

    XR-3:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:25.3.1
      mgmt-ipv4: 172.20.20.13
      mgmt-ipv6: "3fff:172:20:20::13"
      startup-config: config/XR-3.cfg
      labels:
        graph-level: 4
        graph-icon: router

    XR-4:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:25.3.1
      mgmt-ipv4: 172.20.20.14
      mgmt-ipv6: "3fff:172:20:20::14"
      startup-config: config/XR-4.cfg
      labels:
        graph-level: 5
        graph-icon: router

    XR-5:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:25.3.1
      mgmt-ipv4: 172.20.20.15
      mgmt-ipv6: "3fff:172:20:20::15"
      startup-config: config/XR-5.cfg
      labels:
        graph-level: 6
        graph-icon: router
    
    XR-6:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:25.3.1
      mgmt-ipv4: 172.20.20.16
      mgmt-ipv6: "3fff:172:20:20::16"
      startup-config: config/XR-6.cfg
      labels:
        graph-level: 7
        graph-icon: router

    XR-7:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:25.3.1
      mgmt-ipv4: 172.20.20.17
      mgmt-ipv6: "3fff:172:20:20::17"
      startup-config: config/XR-7.cfg
      labels:
        graph-level: 7
        graph-icon: router
    

    XR-8:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:25.3.1
      mgmt-ipv4: 172.20.20.18
      mgmt-ipv6: "3fff:172:20:20::18"
      startup-config: config/XR-8.cfg
      labels:
        graph-level: 8
        graph-icon: router

    SITE-A:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:25.3.1
      mgmt-ipv4: 172.20.20.20
      mgmt-ipv6: "3fff:172:20:20::20"
      startup-config: config/SITE-A.cfg
      labels:
        graph-level: 2
        graph-icon: router

    SITE-B:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:25.3.1
      mgmt-ipv4: 172.20.20.21
      mgmt-ipv6: "3fff:172:20:20::21"
      startup-config: config/SITE-B.cfg
      labels:
        graph-level: 9
        graph-icon: router

    SITE-C:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:25.3.1
      mgmt-ipv4: 172.20.20.22
      mgmt-ipv6: "3fff:172:20:20::22"
      startup-config: config/SITE-C.cfg
      labels:
        graph-level: 9
        graph-icon: router

    HOST-A:
      kind: linux
      image: ghcr.io/insrapperswil/network-ninja:1.0
      mgmt-ipv4: 172.20.20.30
      mgmt-ipv6: "3fff:172:20:20::30"
      exec:
        - bash /mnt/HOST-A.cfg
      binds:
        - config/HOST-A.cfg:/mnt/HOST-A.cfg
        - ../hawkwing/hawkwing:/hawkwing
        - ../hawkwing/config.yaml:/config.yaml
      labels:
        graph-level: 1
        graph-icon: host

    HOST-B:
      kind: linux
      image: ghcr.io/insrapperswil/network-ninja:1.0
      mgmt-ipv4: 172.20.20.31
      mgmt-ipv6: "3fff:172:20:20::31"
      exec:
        - bash /mnt/HOST-B.cfg
      binds:
        - config/HOST-B.cfg:/mnt/HOST-B.cfg
        - ../hawkwing/hawkwing:/hawkwing
        - ../hawkwing/config.yaml:/config.yaml
      labels:
        graph-level: 10
        graph-icon: host

    HOST-C:
      kind: linux
      image: ghcr.io/insrapperswil/network-ninja:1.0
      mgmt-ipv4: 172.20.20.32
      mgmt-ipv6: "3fff:172:20:20::32"
      exec:
        - bash /mnt/HOST-C.cfg
      binds:
        - config/HOST-C.cfg:/mnt/HOST-C.cfg
        - ../hawkwing/hawkwing:/hawkwing
        - ../hawkwing/config.yaml:/config.yaml
      labels:
        graph-level: 10
        graph-icon: host

    HAWK-EYE:
      kind: linux
      image: ghcr.io/insrapperswil/network-ninja:1.0
      mgmt-ipv4: 172.20.20.41
      mgmt-ipv6: "3fff:172:20:20::41"
      exec:
        - bash /mnt/HAWK-EYE.cfg
      binds:
        - config/HAWK-EYE.cfg:/mnt/HAWK-EYE.cfg
        - ../hawkeye/bin/hawkeye:/hawkeye

    SERA-1:
      kind: linux
      image:  ghcr.io/hawkv6/network-consul-ninja:latest
      mgmt-ipv4: 172.20.20.42
      mgmt-ipv6: "3fff:172:20:20::42"
      exec:
        - bash /mnt/SERA-1.cfg
      binds:
        - config/SERA-1/:/mnt/

    SERA-2:
      kind: linux
      image:  ghcr.io/hawkv6/network-consul-ninja:latest
      mgmt-ipv4: 172.20.20.43
      mgmt-ipv6: "3fff:172:20:20::43"
      exec:
        - bash /mnt/SERA-2.cfg
      binds:
        - config/SERA-2/:/mnt/

    SNORT-1:
      kind: linux
      image:  ghcr.io/hawkv6/network-consul-ninja:latest
      mgmt-ipv4: 172.20.20.44
      mgmt-ipv6: "3fff:172:20:20::44"
      exec:
        - bash /mnt/SNORT-1.cfg
      binds:
        - config/SNORT-1/:/mnt/

    SNORT-2:
      kind: linux
      image:  ghcr.io/hawkv6/network-consul-ninja:latest
      mgmt-ipv4: 172.20.20.45
      mgmt-ipv6: "3fff:172:20:20::45"
      exec:
        - bash /mnt/SNORT-2.cfg
      binds:
        - config/SNORT-2/:/mnt/
 
  links:
    - endpoints: ["HOST-A:eth1", "SITE-A:Gi0-0-0-1"]
    - endpoints: ["SITE-A:Gi0-0-0-0", "XR-1:Gi0-0-0-0"]
    - endpoints: ["XR-1:Gi0-0-0-1", "XR-2:Gi0-0-0-0"]
    - endpoints: ["XR-1:Gi0-0-0-2", "XR-3:Gi0-0-0-0"]
    - endpoints: ["XR-2:Gi0-0-0-1", "XR-6:Gi0-0-0-0"]
    - endpoints: ["XR-2:Gi0-0-0-2", "XR-4:Gi0-0-0-0"]
    - endpoints: ["XR-2:Gi0-0-0-3", "XR-3:Gi0-0-0-1"]
    - endpoints: ["XR-2:Gi0-0-0-4", "SERA-1:eth1"]
    - endpoints: ["XR-3:Gi0-0-0-2", "XR-4:Gi0-0-0-1"]
    - endpoints: ["XR-3:Gi0-0-0-3", "XR-7:Gi0-0-0-0"]
    - endpoints: ["XR-3:Gi0-0-0-4", "SERA-2:eth1"]
    - endpoints: ["XR-4:Gi0-0-0-2", "XR-5:Gi0-0-0-0"]
    - endpoints: ["XR-5:Gi0-0-0-1", "XR-6:Gi0-0-0-1"]
    - endpoints: ["XR-5:Gi0-0-0-2", "XR-7:Gi0-0-0-1"]
    - endpoints: ["XR-6:Gi0-0-0-2", "XR-7:Gi0-0-0-2"]
    - endpoints: ["XR-6:Gi0-0-0-3", "XR-8:Gi0-0-0-0"]
    - endpoints: ["XR-6:Gi0-0-0-4", "SITE-B:Gi0-0-0-2"]
    - endpoints: ["XR-6:Gi0-0-0-5", "SNORT-1:eth1"]
    - endpoints: ["XR-7:Gi0-0-0-3", "XR-8:Gi0-0-0-1"]
    - endpoints: ["XR-7:Gi0-0-0-4", "SITE-C:Gi0-0-0-2"]
    - endpoints: ["XR-7:Gi0-0-0-5", "SNORT-2:eth1"]
    - endpoints: ["XR-8:Gi0-0-0-2", "SITE-B:Gi0-0-0-0"]
    - endpoints: ["XR-8:Gi0-0-0-3", "SITE-C:Gi0-0-0-0"]
    - endpoints: ["SITE-B:Gi0-0-0-1", "HOST-B:eth1"]
    - endpoints: ["SITE-C:Gi0-0-0-1", "HOST-C:eth1"]
